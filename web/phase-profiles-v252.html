<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RocketAeroHeat · 非相似剖面</title>
<style>body{margin:0;background:#f4f6f8;color:#243445;font:15px system-ui,"Microsoft YaHei",sans-serif}main{max-width:1200px;margin:24px auto;padding:0 20px}header{display:flex;align-items:center;justify-content:space-between}h1{font-size:22px}a{color:#225f85}section{background:white;border:1px solid #dbe1e7;border-radius:5px;padding:18px;margin:16px 0}.controls{display:flex;gap:20px;align-items:center;flex-wrap:wrap}select{padding:7px}input{width:260px}.plots{display:grid;grid-template-columns:1fr 1fr;gap:18px}canvas{width:100%;height:300px}small,.note{color:#596775;line-height:1.7}#values{line-height:1.9}.label{font-size:14px;margin:0 0 10px}button{padding:7px 12px;background:#fff;border:1px solid #aebdca;border-radius:4px;cursor:pointer}@media(max-width:750px){.plots{grid-template-columns:1fr}header{display:block}}</style></head>
<body><main><header><h1>非相似边界层 · 沿程与实际剖面</h1><a href="index.html">返回三维结果</a></header>
<p class="note">M5 · 攻角20° · 旋转球鼻工程近似 · 附着层流候选。表面极角是沿鼻部的位置，不是攻角或物理时间。尚无完整三维横流或实验资格。</p>
<section class="controls"><label>计算分支 <select id="branch"></select></label><label>沿程位置 <input id="station" type="range" min="0" max="30" step="1" value="20"></label><output id="angle"></output><button id="csv">导出当前剖面 CSV</button></section>
<section><div id="values"></div><small id="method"></small></section>
<div class="plots"><section><p class="label">沿程入壁热流（MW/m²）— 表面极角（°）</p><canvas id="heat"></canvas></section><section><p class="label">给定壁温（K）— 表面极角（°）</p><canvas id="wall"></canvas></section><section><p class="label">速度比 u/Ue — 距壁距离（mm）</p><canvas id="velocity"></canvas></section><section><p class="label">流体温度（K）— 距壁距离（mm）</p><canvas id="temperature"></canvas></section></div>
<p class="note">图中展示当前分支；拖动滑块比较上游历史影响。温度为边界层气体温度；壁温为给定条件，固体壁温未求解。驻点Ue=0处的速度比是驻点极限解。页面剖面取101点供查看与CSV导出，完整剖面保存在计算结果中。</p></main><script src="profiles-data.js"></script><script src="phase-profiles-v252.js"></script></body></html>
