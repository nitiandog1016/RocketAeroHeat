<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Short Test 65 · 七站周向换热</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fafbfc;color:#213447;font:14px/1.5 "Segoe UI","Microsoft YaHei",sans-serif}main{max-width:1100px;margin:auto;padding:20px}h1{font-size:21px;margin:0}p{margin:.45em 0}.muted{color:#516578}.controls,.cursor,.legend{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.controls{margin:16px 0 4px}select,button{font:inherit;border:1px solid #becbd5;background:white;color:inherit;padding:3px 6px;border-radius:3px}label{display:flex;gap:5px;align-items:center}svg{width:100%;height:clamp(230px,35vh,365px);display:block;background:white;border:1px solid #dbe1e5}svg text{fill:#44586a;font-size:11px}.legend{min-height:30px;font-size:12px}.cursor{margin:8px 0}.cursor input{flex:1;min-width:60px;accent-color:#245979}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13px}th,td{text-align:right;padding:5px 7px;border-bottom:1px solid #e0e5e8;white-space:nowrap}th{color:#465b6c;font-weight:600}.note{margin-top:12px;font-size:12px}output{min-width:6em}button{cursor:pointer}.range{margin:8px 0;font-size:13px}.range p{margin:2px 0}
@media(max-width:520px){main{padding:8px}h1{font-size:17px}.controls{margin:8px 0;gap:6px}table{font-size:12px}td,th{padding:4px}.note{margin-top:6px}svg{height:220px}}
</style></head><body><main>
<h1>七站周向换热</h1><p class="muted" id="condition"></p>
<div class="controls"><label>极角 <select id="angle"><option value="rear">背风两站</option></select></label>
<label>物理量 <select id="field"><option value="nu">局部 Nu</option><option value="flux">入壁热流 (W/m²)</option></select></label></div>
<div class="legend" id="legend"></div><svg id="plot" role="img" aria-label="换热随周向方位的变化"></svg>
<label class="cursor">取样方位 <input id="phi" type="range" min="0" max="360" step="0.1" value="0"><output id="location"></output></label>
<div class="tablewrap"><table><thead><tr><th>极角 (°)</th><th>Nu</th><th>入壁热流 (W/m²)</th><th>STL 面</th><th>取样状态</th></tr></thead><tbody id="probe"></tbody></table></div>
<div class="range" id="range"></div><p class="note muted">方位从 +Z 转向 +Y。热流由壁反力和边通量修正按对偶面积换算，在湿壁交点分片线性插值，正值入壁。Nu 采用当地壁温导热系数。共享点显示代表面号。</p>
</main><script>/*SHORT65_OFFLINE_DATA*/</script>
<script>
(() => {
'use strict';
const $=id=>document.getElementById(id), svg=$('plot'), palette=['#285d80','#ae5c32'];
const labels={sphere:'外露球面',tube:'支管遮盖',cap:'端盖遮盖',seam:'接缝','mesh-disagreement':'几何归属不同',missing:'无交点',multiple:'多重交点'};
let data,bridge,series=[],selected=[],limits=[],width=600,height=250,left=55,right=16,top=21,bottom=40;
const val=(n,d=3)=>Number.isFinite(n)?n.toFixed(d):'—';
function element(tag,attrs,txt){
  const e=document.createElementNS('http://www.w3.org/2000/svg',tag);
  Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(txt!==undefined)e.textContent=txt;svg.append(e);return e;
}
function nearest(rows,phi){
  let lo=0,hi=rows.length-1;
  while(lo<hi){const mid=(lo+hi)>>1;if(rows[mid][1]<phi)lo=mid+1;else hi=mid;}
  const last=rows[rows.length-1], first=rows[0];
  if(phi>last[1] && 360-phi<phi-last[1])return first;
  if(lo>0 && Math.abs(rows[lo-1][1]-phi)<Math.abs(rows[lo][1]-phi))return rows[lo-1];
  return rows[lo];
}
function notify(kind,extra){
  if(bridge)bridge.Data=Object.assign({kind,frame:data.frame},extra);
}
function load(payload){
  data=payload;const options=$('angle');options.length=1;
  for(const a of data.angles)options.add(new Option(a+'°',String(a)));
  $('condition').textContent='Short Test 65 · Re = 882 · 14D · 扰动后 '+val(data.timeMs,6)+' ms · 步长 '+val(data.stepMs,6)+' ms';
  show();
}
function show(){
  if(!data)return;
  selected=$('angle').value==='rear'?[119.8,166.7]:[Number($('angle').value)];
  series=selected.map(a=>data.rows.filter(r=>r[0]===a));
  $('phi').disabled=selected[0]===0;if($('phi').disabled)$('phi').value=0;
  const col=$('field').value==='nu'?2:3,values=series.flat().map(r=>r[col]).filter(Number.isFinite);
  if(col===2)for(const a of selected)values.push(data.experiment[data.angles.indexOf(a)]);
  const lo=Math.min(...values),hi=Math.max(...values),pad=Math.max(.04*(hi-lo),.01);
  limits=[lo-pad,hi+pad];
  $('legend').replaceChildren();selected.forEach((a,i)=>{
    const s=document.createElement('span');s.style.color=palette[i];s.textContent='━ '+a+'°';$('legend').append(s);
  });
  if(col===2)$('legend').append('虚线为相应测站的实验 Nu');
  draw();
}
function draw(){
  if(!data || !series.length)return;
  width=Math.max(240,svg.clientWidth);height=Math.max(210,svg.clientHeight);left=width<450?49:67;
  const X=p=>left+(width-left-right)*p/360,Y=v=>top+(height-top-bottom)*(limits[1]-v)/(limits[1]-limits[0]);
  svg.setAttribute('viewBox','0 0 '+width+' '+height);svg.replaceChildren();
  for(let i=0;i<=4;i++){const v=limits[0]+(limits[1]-limits[0])*i/4;
    element('line',{x1:left,x2:width-right,y1:Y(v),y2:Y(v),stroke:'#e0e6eb'});
    element('text',{x:left-5,y:Y(v)+4,'text-anchor':'end'},val(v,$('field').value==='nu'?1:0));
  }
  for(const p of [0,90,180,270,360])element('text',{x:X(p),y:height-21,'text-anchor':'middle'},p);
  element('text',{x:(width+left-right)/2,y:height-4,'text-anchor':'middle'},'方位角 (°)');
  const col=$('field').value==='nu'?2:3,unit=col===2?'Nu':'W/m²';
  element('text',{x:left,y:14},unit);
  const phi=Number($('phi').value),probe=$('probe');probe.replaceChildren();$('range').replaceChildren();
  const breaks=[];const actual=nearest(series[0],phi)[1];
  element('line',{x1:X(actual),x2:X(actual),y1:top,y2:height-bottom,stroke:'#8695a3','stroke-dasharray':'2 3'});
  $('location').textContent=selected[0]===0?'迎风点':val(actual,3)+'°';
  series.forEach((rows,i)=>{
    const color=palette[i],a=selected[i],samples=rows.length===1?rows:rows.concat([[a,360,...rows[0].slice(2)]]);
    let path='',down=false,ngaps=0;
    for(const r of samples){if(!Number.isFinite(r[col])){if(down)ngaps++;down=false;continue;}
      path+=(down?'L':'M')+X(r[1]).toFixed(2)+' '+Y(r[col]).toFixed(2)+' ';down=true;}
    breaks.push(ngaps);element('path',{d:path,fill:'none',stroke:color,'stroke-width':2});
    if(col===2){const v=data.experiment[data.angles.indexOf(a)];
      element('line',{x1:left,x2:width-right,y1:Y(v),y2:Y(v),stroke:color,'stroke-dasharray':'5 4',opacity:.7});}
    const r=nearest(rows,phi),known=Number.isFinite(r[col]),tr=document.createElement('tr');
    for(const text of [a,val(r[2]),val(r[3],2),r[5]||'—',labels[data.states[r[7]-1]]]){
      const td=document.createElement('td');td.textContent=text;tr.append(td);}
    if(known){element('circle',{cx:X(r[1]),cy:Y(r[col]),r:4,fill:color});
      if(bridge){const td=tr.children[3];const btn=document.createElement('button');btn.textContent=r[5];btn.title='在区域结果中定位此面';
        btn.onclick=()=>notify('azimuth-locate',{face:r[5]});td.replaceChildren(btn);}}
    probe.append(tr);
    const valid=rows.filter(v=>Number.isFinite(v[col]));if(!valid.length)return;
    const low=valid.reduce((l,v)=>v[col]<l[col]?v:l),high=valid.reduce((h,v)=>v[col]>h[col]?v:h);
    const info=document.createElement('p');info.textContent=a+'° 取样范围 '+val(low[col])+' 至 '+val(high[col])+' '+unit+
      '（最低 '+val(low[1],2)+'° / 面 '+low[5]+'，最高 '+val(high[1],2)+'° / 面 '+high[5]+'）';$('range').append(info);
    const holes=data.gaps.filter(g=>g[0]===a);
    if(holes.length){const note=document.createElement('p');note.textContent='遮盖及归属不一致的方位：'+holes.map(g=>val(g[1],3)+'°–'+val(g[2],3)+'°').join('、');$('range').append(note);}
  });
  if(selected.length===2 && data.rear.status==='positive-throughout'){
    const note=document.createElement('p');note.textContent='共同方位逐段下界：Nu(119.8°) − Nu(166.7°) ≥ '+(Math.floor(data.rear.lowerBound*1000)/1000).toFixed(3)+'。';$('range').append(note);}
  notify('azimuth-rendered',{angles:selected,field:$('field').value,phi:actual,gaps:breaks,rows:series.map(s=>s.length),
    values:series.map(s=>nearest(s,phi)[col]),faces:series.map(s=>nearest(s,phi)[5])});
}
$('angle').onchange=show;$('field').onchange=show;$('phi').oninput=draw;
svg.onclick=e=>{if($('phi').disabled)return;$('phi').value=Math.min(360,Math.max(0,(e.clientX-svg.getBoundingClientRect().left-left)*360/(width-left-right)));draw();};
window.addEventListener('resize',draw);
window.setup=component=>{
  bridge=component;const receive=()=>{const m=component.Data;if(!m)return;
    if(m.kind==='short65-azimuth')load(m);
    if(m.kind==='azimuth-view' && data){$('angle').value=m.angle==='rear'?'rear':String(m.angle);
      if(m.field)$('field').value=m.field;if(Number.isFinite(m.phi))$('phi').value=m.phi;show();}};
  component.addEventListener('DataChanged',receive);receive();
  if(!data)component.Data={kind:'azimuth-ready'};
};
if(window.SHORT65_DATA)load(window.SHORT65_DATA);
})();
</script></body></html>
