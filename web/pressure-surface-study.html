<!doctype html>
<html lang="zh-CN">
<head>
 <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
 <title>RocketAeroHeat · 压力驱动表面流线</title>
 <link rel="stylesheet" href="rocket-sensitivity.css"><link rel="stylesheet" href="pressure-surface-study.css">
</head>
<body class="wall-study surface-study">
<header><strong>RocketAeroHeat</strong><span>压力驱动表面流线 · 流管横向度量</span><span>条件数值研究 · 热流未求 · 新增合格面积0</span></header>
<main>
 <aside>
  <div class="workflowControls">
   <label for="caseChoice">验证模型</label><select id="caseChoice" aria-label="选择流线验证模型"></select>
   <nav aria-label="科研工作流">
    <button data-step="0">1 输入模型</button><button data-step="1">2 生成网格</button>
    <button data-step="2">3 添加边界条件</button><button data-step="3">4 计算</button><button data-step="4">5 查看结果</button>
   </nav>
  </div>
  <h1 id="title"></h1><p id="description"></p><dl id="details"></dl>
  <details><summary>输入来源与方法适用范围</summary><p id="scope"></p><pre id="sources"></pre></details>
  <p id="roleNote" class="note"></p><p><a href="pressure-surface-flow-data.json" download>下载数值与来源记录</a></p>
 </aside>
 <section class="content">
  <iframe id="viewer" title="同窗三维表面流线"></iframe>
  <section class="comparison">
   <div class="curveControls">
    <strong>沿流线定量分布</strong>
    <select id="field" aria-label="流线曲线物理量">
     <option value="metricRatio">数值横向度量 h/h₀</option><option value="metric">数值横向度量 h</option>
     <option value="pressureInputPa">压力（流线输入）/ kPa</option><option value="temperatureInputK">外缘温度Te / K</option><option value="speedInputMS">外缘速度幅值 / m/s</option>
    </select>
    <label><input id="sharedScale" type="checkbox" checked>同单位模型统一纵轴</label><button id="saveCSV">导出当前流线 CSV</button>
   </div>
   <canvas id="curve" aria-label="沿流线分布，点击选择真实积分站点"></canvas>
   <div class="stationControl"><label>积分站点 <input id="station" type="range" min="0" max="1" value="0" step="1" aria-label="流线积分站点"></label><span id="stationNote"></span></div>
   <p id="plotNote" class="note">三维点击可见流线站点，或点击曲线/拖动站点滑块；仅显示实际积分前缀。</p>
  </section>
  <section class="comparison"><strong>流线站点探针 · 数值与来源分列</strong><dl id="probe"></dl></section>
 </section>
</main>
<footer>SI · 主轴X、鼻尖+X · 灰色三角底图为几何 · 蓝线为条件数值路径 · 未求热流不补零</footer>
<script src="pressure-surface-flow-data.js"></script><script src="pressure-surface-study.js"></script>
</body></html>
