<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RocketAeroHeat · 激波拟合内核</title><link rel="stylesheet" href="ale-study.css"></head>
<body><header><strong>RocketAeroHeat</strong><span>移动激波 · 共享面三维守恒</span><span>研究验证 · 新增合格热流面积 0 m²</span></header>
<main><aside><label for="caseChoice">已保存的研究</label><select id="caseChoice" aria-label="选择研究"></select>
<nav aria-label="科研工作流"><button data-step="0">1 输入模型</button><button data-step="1">2 生成网格</button><button data-step="2">3 添加边界条件</button><button data-step="3">4 计算</button><button data-step="4">5 查看结果</button></nav>
<h1 id="title"></h1><p id="scope"></p><dl id="details"></dl><details><summary>算法与适用范围</summary><p id="gasScope"></p><p>本页读取已保存研究，切换流程步骤不重新计算。真实箭体激波、外缘与热流尚未求得；几何测试不能算作新增物理解面积。</p></details><a href="ale-data.json" download>下载数值与来源记录</a></aside>
<section class="content"><div class="tools"><label for="view">三维范围</label><select id="view"><option value="all">全部边界</option><option value="wall">壁面</option><option value="outer">激波 / 候选外壳</option><option value="rocket">完整箭体（未求场量）</option></select><select id="field" aria-label="云图变量"><option value="pressurePa">流体压力 / Pa</option><option value="temperatureK">流体温度 / K</option><option value="speedMS">速度幅值 / m/s</option><option value="wallPressurePa">Riemann壁压 / Pa</option><option value="heatFluxWm2">热流 / W/m²</option><option value="wallTemperatureK">求解壁温 / K</option></select><span id="renderState">等待三维显示</span></div>
<iframe id="viewer" title="实际保存的三维网格与面元云图"></iframe>
<div class="frameControl"><label for="frame">保存帧</label><input id="frame" type="range" min="0" max="1" value="1" step="1" aria-label="实际保存帧"><span id="time"></span></div>
<section class="panel"><div class="tools"><strong>边界面元分布</strong><label for="face">面元</label><input id="face" type="range" min="0" max="1" value="0" step="1" aria-label="边界面元"><button id="csv">导出当前范围 CSV</button></div><canvas id="curve" aria-label="实际面元值，缺失处断开"></canvas><p class="note">按当前范围面元顺序列出实际值；不插补未知值，不将连线解释为流线或周向截线。</p></section>
<section class="panel"><strong>面元探针</strong><p id="role"></p><dl id="probe"></dl><details><summary>逐场量方法、状态与来源</summary><dl id="methods"></dl></details></section></section></main><footer>SI · 主轴 X、鼻尖 +X · 层内流体温度、Te、Tr、给定Tw、求解Tw分别标明 · 未知为灰色</footer><script src="ale-data.js"></script><script src="ale-study.js"></script></body></html>
