<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>区域结果与验证</title><link rel="stylesheet" href="geometry.css"><link rel="stylesheet" href="evidence.css"></head>
<body>
<header><div class="title"><strong id="caption">区域结果与验证</strong><span id="summary">等待结果</span></div><div class="controls"><button id="reset">适配模型</button><button data-view="side">侧视</button><button data-view="nose">鼻向</button><button data-view="iso">轴测</button><label><input id="wire" type="checkbox">网格</label><label><input id="panMode" type="checkbox">平移</label></div><small id="coordinates">SI · 主轴 X · 鼻尖 +X</small><small id="caseCondition"></small></header>
<div class="fieldControls"><label>场量 <select id="fieldChoice"></select></label><label>固定色标 <input id="rangeLow" type="number" step="any" aria-label="色标下限"> 至 <input id="rangeHigh" type="number" step="any" aria-label="色标上限"></label><button id="applyRange">应用</button><button id="resetRange">全模型范围</button><button id="exportLedger">当前变量证据CSV</button><span id="fieldIdentity"></span></div>
<div class="workspace"><div class="modelColumn"><main><canvas id="scene"></canvas><div id="empty"><strong>等待原始面元结果</strong><span>所有区域与未知面元均保留</span></div><div id="error" hidden></div><div id="axes"></div><div class="hint">拖动旋转 · 滚轮缩放 · Shift / 右键平移 · 单击原面元查询</div></main><div id="fieldLegend" hidden></div><section id="evidenceSection"><div class="sectionControls"><label>截面 X / m <input id="sectionX" type="number" step="any"></label><input id="sectionSlider" type="range" aria-label="截面位置"><button id="exportSection">导出截面</button></div><small id="sectionSummary">真实 X 截面交线；面元常值</small><canvas id="sectionCanvas"></canvas></section></div>
<aside><section><h2>全面积账本</h2><div id="coverageSummary"></div><p class="note">数值可用：工程或研究计算。验证通过另计。给定、未知、超域各自保留。区域选择只描边，色标与原值不变。</p><div class="tableScroll"><table id="regionTable"><thead><tr><th>区域 / 面积 m²</th><th>工程</th><th>研究</th><th>给定</th><th>未知</th><th>超域</th><th>验证通过</th></tr></thead><tbody></tbody></table></div><p id="jointSummary" class="note"></p></section><section><h2>原面元查询 <span id="probeID">未选择</span></h2><p id="probePosition" class="note">点击模型或选择区域定位。温度身份分别列出。</p><div id="probeFields"></div></section><details id="evidenceDetails"><summary>验证证据与来源</summary><div id="evidenceContent"></div></details></aside></div>
<footer><span id="bounds">几何尺寸 / m：—</span><span id="footerStatus">区域值与资格分开统计</span></footer>
<script src="ale-section-core.js"></script><script src="geometry.js"></script><script src="evidence.js"></script>
</body></html>
